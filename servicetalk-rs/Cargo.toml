[package]
name = "servicetalk"
version = "0.1.0"
edition = "2021"
description = "Runtime crate for Rust foreign classes in servicetalk."

# Library only; foreign-class crates depend on this and provide their own
# binary entry-point generated by servicetalk's BuildForeignClass.
[lib]
name = "servicetalk"
path = "src/lib.rs"
