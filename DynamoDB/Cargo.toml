[package]
name = "dynamodb_st"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "DynamoDB"
path = "src/_st_main.rs"

[dependencies]
servicetalk = { path = "../servicetalk-rs" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
serde_json = "1"
once_cell = "1"
