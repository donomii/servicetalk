[package]
name = "robocop_wrapper"
version = "0.1.0"
edition = "2021"

# The library carries the wrapper functions servicetalk dispatches to.
# Cargo auto-detects src/lib.rs.

# Binary entry point — auto-generated by servicetalk's
# BuildForeignClass from the manifest.  Name MUST match the class
# name so spawn paths line up.
[[bin]]
name = "Robocop"
path = "src/_st_main.rs"

[dependencies]
servicetalk = { path = "../servicetalk-rs" }

# The real robocop crate.  No vendoring, no re-implementation — the
# wrapper just links it in.  The path is absolute on purpose: we
# don't want a symlink dance, and the user's exagit checkout is at a
# known location.  Per Jeremy: do not alter any code in exagit.
robocop = { path = "/Users/jer/exagit/monorepo-robotchecker/rust/services/robocop" }

# Robocop's public surface (Server / ServerHandler / check_urls) is
# tonic-async.  We need a tokio runtime in the subprocess to drive
# the future synchronously from servicetalk's dispatch path.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tonic = { version = "0.11.0", features = ["tls", "tls-roots"] }
serde_json = "1"
once_cell = "1"
