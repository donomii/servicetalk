[package]
name = "rcounter"
version = "0.1.0"
edition = "2021"

# Library where the user puts their method functions.  Cargo
# auto-detects src/lib.rs.

# Binary entry point — auto-generated by servicetalk's
# BuildForeignClass from the manifest.  Name MUST match the class
# name so spawn paths line up.
[[bin]]
name = "RCounter"
path = "src/_st_main.rs"

[dependencies]
servicetalk = { path = "../servicetalk-rs" }
